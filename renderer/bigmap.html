<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TarkovMap — full map</title>
<link rel="stylesheet" href="../node_modules/leaflet/dist/leaflet.css">
<link rel="stylesheet" href="shared/tm.css">
<style>
html, body { background: var(--bg); overflow: hidden; width: 100vw; height: 100vh; user-select: none; }
#map { position: absolute; inset: 0; }
#rail { position: absolute; right: 0; top: 0; bottom: 0; width: 250px; background: rgba(8,9,10,.72); backdrop-filter: blur(4px); border-left: 1px solid var(--line); padding: 14px 14px 14px 16px; overflow: auto; z-index: 900; -webkit-app-region: no-drag; }
#rail h5 { margin: 12px 0 6px; font-size: 10px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--dim); font-weight: 600; }
.chip { display: inline-block; padding: 3px 9px; border-radius: 9px; background: rgba(255,255,255,.06); color: #fff; font-size: 12px; margin: 0 4px 4px 0; border: 1px solid transparent; cursor: pointer; }
.chip.on { background: rgba(120,230,140,.14); border-color: rgba(120,230,140,.5); color: var(--green); }
.chip.f { cursor: pointer; }
input[type=range] { width: 100%; }
input[type=text] { width: 100%; font: inherit; font-size: 12px; color: #fff; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 9px; padding: 6px 8px; outline: none; }
.val { font-weight: 600; font-size: 16px; }
#head { position: absolute; left: 12px; top: 10px; z-index: 900; font-size: 12px; letter-spacing: 2px; color: rgba(255,255,255,.8); background: rgba(8,9,10,.6); padding: 5px 10px; border-radius: 8px; -webkit-app-region: drag; }
#head b { color: #fff; margin-left: 8px; }
#close { position: absolute; right: 262px; top: 10px; z-index: 900; font-size: 12px; color: #fff; background: rgba(8,9,10,.6); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
#mates .row { height: 24px; }
#notice { display: none; font-size: 11px; color: var(--red); background: rgba(255,90,90,.1); border: 1px solid rgba(255,90,90,.35); border-radius: 8px; padding: 6px 8px; margin-bottom: 8px; }
.chip.empty { opacity: .55; text-decoration: underline dotted rgba(255,255,255,.4); text-underline-offset: 3px; }
#notice.soft { color: var(--amber); background: rgba(255,196,92,.08); border-color: rgba(255,196,92,.3); }
.tm-base.tm-f-studio { filter: saturate(.75) contrast(1.15) brightness(1.08); }
.tm-base.tm-f-night, .tm-floor.tm-f-night { filter: brightness(.55) saturate(.35) hue-rotate(190deg); }
.chip.dim { opacity: .45; }
#credit { position: absolute; left: 12px; bottom: 10px; z-index: 900; font-size: 10px; letter-spacing: 1px; color: rgba(255,255,255,.75); background: rgba(8,9,10,.6); padding: 3px 8px; border-radius: 6px; }
#ans { font-size: 11px; color: var(--dim); margin-top: 4px; min-height: 14px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="head">TARKOVMAP <b id="title">—</b></div>
<button id="close">Hide</button>
<button id="open" style="right:330px">TarkovMap</button>
<div id="credit"></div>
<div id="rail">
  <div id="notice"></div>
  <h5>Style</h5>
  <div id="styles"></div>
  <h5>Layers</h5>
  <div id="layers"></div>
  <h5>Floor</h5>
  <div id="floors"></div>
  <h5>Flea, at least</h5>
  <div class="val" id="fleaVal">off</div>
  <input type="range" id="flea" min="0" max="300000" step="5000" value="0">
  <h5>Ask</h5>
  <input type="text" id="ask" placeholder="extracts, dorm keys, over 40k…">
  <div id="ans"></div>
  <h5>Squad</h5>
  <div id="mates"></div>
  <h5>Quests here</h5>
  <div id="quests"></div>
  <h5>Ping</h5>
  <div><span class="chip f" data-ping="regroup">regroup</span><span class="chip f" data-ping="loot here">loot here</span><span class="chip f" data-ping="enemy seen">enemy seen</span><span class="chip f" data-ping="extract">extract</span></div>
</div>
<script src="../node_modules/leaflet/dist/leaflet.js"></script>
<script src="shared/style-engine.js"></script>
<script src="shared/map-core.js"></script>
<script src="bigmap.js"></script>
</body>
</html>
